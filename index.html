<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CineYield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --canvas:#09090B;--panel:#141417;--panel2:#1B1B1F;--well:#0C0C0E;
  --line:rgba(255,255,255,0.055);--line2:rgba(255,255,255,0.10);
  --ink:#F4F4F5;--ink2:#A1A1AA;--ink3:#65656E;
  --gold:#6366F1;--gold-hi:#818CF8;--gold-dim:#312E81;
  --green:#7EBE96;--amber:#CBA04E;--red:#C56B5B;--purple:#9B6BE0;
  --serif:'Instrument Serif',Georgia,serif;
  --ui:'Space Grotesk',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,Menlo,monospace;
}
body{background:var(--canvas);font-family:var(--ui);-webkit-font-smoothing:antialiased;letter-spacing:0.004em}
button{font-family:inherit;border:none;background:none;color:inherit;letter-spacing:inherit}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold-hi)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#1E1E22;border:3px solid var(--canvas)}
::-webkit-scrollbar-track{background:transparent}
@keyframes cypulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes cyspin{to{transform:rotate(360deg)}}
@keyframes cyrise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes cyshimmer{to{background-position:0 0, 220% 0}}
@media(min-width:1180px){[data-search]{display:flex !important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
(function () {
  // ------------------------------------------------------------------ state
  var state = { route: undefined, analyzing: false, progress: 0, approved: false };
  var props = { defaultRoute: "library" };
  var timer = null;

  function setState(patch) { Object.assign(state, patch); render(); }

  function go(r) {
    setState({ route: r });
    try { var el = document.getElementById("cy-content"); if (el) el.scrollTop = 0; } catch (e) {}
  }

  function analyze() {
    if (state.analyzing) return;
    setState({ analyzing: true, progress: 0 });
    var p = 0;
    timer = setInterval(function () {
      p = Math.min(100, p + 8 + Math.random() * 6);
      setState({ progress: p });
      if (p >= 100) {
        clearInterval(timer); timer = null;
        setTimeout(function () { setState({ analyzing: false, route: "scene" }); }, 550);
      }
    }, 220);
  }

  function approve() { setState({ approved: true }); }

  // ------------------------------------------------------------------ helpers
  function esc(s) { return String(s); }
  function H(o) { return o ? " data-hover='" + JSON.stringify(o) + "'" : ""; }
  function A(action) { return " data-action='" + action + "'"; }

  // ------------------------------------------------------------------ values (ported from support.js DCLogic.renderVals)
  function computeVals() {
    var route = state.route != null ? state.route : (props.defaultRoute || "library");

    // hover objects
    var ctaHover = { background: "var(--gold-hi)" };
    var ghostHover = { borderColor: "var(--gold)", color: "var(--gold-hi)" };
    var linkHover = { color: "var(--gold)" };
    var topHover = { color: "var(--ink)" };
    var primaryBtnHover = { filter: "brightness(1.12)" };
    var cardHover = { background: "var(--panel2)" };
    var rowHover = { background: "rgba(255,255,255,0.03)" };

    // top nav
    var topnav = [["Library", "library"], ["Opportunities", "scene"], ["Marketplace", "marketplace"], ["Deals", "deal"], ["Analytics", "analytics"]].map(function (pair) {
      var label = pair[0], r = pair[1];
      var on = route === r || (r === "scene" && route === "opportunity");
      return { label: label, r: r, style: "display:inline-flex;align-items:center;height:60px;padding:0;border:none;background:none;font:500 14px var(--ui);letter-spacing:-0.01em;cursor:pointer;color:" + (on ? "var(--ink)" : "var(--ink2)") + ";box-shadow:" + (on ? "inset 0 -2px 0 var(--gold)" : "none") };
    });

    // library stat strip
    var dealsCount = state.approved ? 19 : 18;
    var statVal = function (color) { return "font:600 26px var(--ui);letter-spacing:-0.4px;color:" + color + ";line-height:0.9;margin-top:9px"; };
    var libStats = [
      { label: "Scenes analyzed", value: "1,284", val: statVal("var(--ink)") },
      { label: "Opportunities", value: "342", val: statVal("var(--ink)") },
      { label: "Active deals", value: String(dealsCount), val: statVal("var(--ink)") },
      { label: "Approvals pending", value: "5", val: statVal("var(--amber)") }
    ];

    // catalog
    var thumb = function (g) { return "position:relative;height:158px;background:" + g; };
    var stColor = function (s) { return s === "Analyzed" ? "var(--green)" : s === "Analyzing" ? "var(--gold)" : "var(--ink3)"; };
    var badge = function (s) { return "position:absolute;top:12px;right:12px;padding:4px 9px;border-radius:5px;font:600 9.5px var(--ui);letter-spacing:0.5px;text-transform:uppercase;background:rgba(13,11,9,0.62);backdrop-filter:blur(4px);color:" + stColor(s); };
    var catalogRaw = [
      { title: "HORIZONS", sub: "Sci-Fi Drama Series · S2", fmt: "tv series", status: "Analyzed", scenes: "312", opps: "47", val: "$2.84M", updated: "2h ago", g: "radial-gradient(120% 100% at 30% 20%,#3a3050,#221d2e 55%,#0d0b0f)" },
      { title: "Echoes of Tomorrow", sub: "Feature Film", fmt: "film", status: "Analyzed", scenes: "88", opps: "12", val: "$960K", updated: "1d ago", g: "radial-gradient(120% 100% at 70% 30%,#2a3a4a,#1a222c 55%,#0b0d10)" },
      { title: "Second Chapter", sub: "Microdrama", fmt: "microdrama", status: "Analyzing", scenes: "54", opps: "—", val: "—", updated: "live", g: "radial-gradient(120% 100% at 50% 40%,#4a3030,#2a1e1e 55%,#0f0b0a)" },
      { title: "Frame by Frame", sub: "Creator Series", fmt: "youtube", status: "Analyzed", scenes: "31", opps: "9", val: "$120K", updated: "3d ago", g: "radial-gradient(120% 100% at 40% 30%,#3a3a2a,#22221a 55%,#0d0d0a)" },
      { title: "Urban Pulse", sub: "Social Clips", fmt: "social", status: "Queued", scenes: "—", opps: "—", val: "—", updated: "—", g: "radial-gradient(120% 100% at 60% 40%,#2c3238,#191d20 55%,#0a0c0d)" },
      { title: "North Line", sub: "TV Drama", fmt: "tv series", status: "Analyzed", scenes: "120", opps: "19", val: "$780K", updated: "5d ago", g: "radial-gradient(120% 100% at 35% 25%,#453045,#241e24 55%,#0e0b0e)" }
    ];
    var catalog = catalogRaw.map(function (c) { return Object.assign({}, c, { thumb: thumb(c.g), badge: badge(c.status) }); });

    // detected boxes on player
    var boxOf = function (x, y, w, h, primary) { return "position:absolute;left:" + x + "%;top:" + y + "%;width:" + w + "%;height:" + h + "%;border:" + (primary ? "1.5px solid var(--gold)" : "1px solid rgba(99,102,241,0.5)") + ";background:" + (primary ? "rgba(99,102,241,0.08)" : "transparent"); };
    var tagOf = function (primary) { return "position:absolute;top:-19px;left:-1px;padding:2px 6px;font:400 9.5px var(--mono);white-space:nowrap;background:" + (primary ? "var(--gold)" : "rgba(13,11,9,0.85)") + ";color:" + (primary ? "#FFFFFF" : "#e9ddc4"); };
    var boxes = [
      { label: "Wireless Headphones", conf: 94, box: boxOf(30, 48, 15, 16, true), tag: tagOf(true) },
      { label: "Smartphone", conf: 92, box: boxOf(58, 60, 9, 13), tag: tagOf(false) },
      { label: "Smart Speaker", conf: 86, box: boxOf(74, 42, 11, 24), tag: tagOf(false) }
    ];

    // objects panel
    var objects = [
      { label: "Wireless Headphones", cat: "Consumer audio", conf: 94, mark: "var(--gold)" },
      { label: "Smartphone", cat: "Mobile devices", conf: 92, mark: "#1E1E22" },
      { label: "Coffee Mug", cat: "Home / beverage", conf: 89, mark: "#1E1E22" },
      { label: "Smart Speaker", cat: "Smart home", conf: 86, mark: "#1E1E22" },
      { label: "Table Lamp", cat: "Home / lighting", conf: 83, mark: "#1E1E22" },
      { label: "Backpack", cat: "Accessories", conf: 81, mark: "#1E1E22" }
    ];

    // opportunity table
    var rowBase = function (primary) { return "display:grid;grid-template-columns:1.6fr 1fr 0.7fr 0.9fr 0.9fr 0.8fr 0.9fr 0.9fr 34px;gap:0;padding:13px 22px;border-top:1px solid var(--line);cursor:pointer;" + (primary ? "background:rgba(99,102,241,0.06)" : ""); };
    var natChip = function (n) { return "display:inline-block;padding:2px 8px;border-radius:2px;font:400 11.5px var(--mono);" + (n >= 85 ? "background:rgba(126,190,150,0.14);color:var(--green)" : n >= 70 ? "background:rgba(203,160,78,0.14);color:var(--amber)" : "background:#1E1E22;color:var(--ink2)"); };
    var rightsChip = function (r) { return "display:inline-block;padding:2px 8px;border-radius:2px;font:600 10px var(--ui);letter-spacing:0.4px;" + (r === "Clear" ? "background:rgba(126,190,150,0.12);color:var(--green)" : "background:rgba(203,160,78,0.12);color:var(--amber)"); };
    var oppRaw = [
      { cat: "Consumer Audio", obj: "Wireless Headphones", tc: "00:12–00:38", screen: "26s", nat: 92, safe: 96, cx: "Low", rights: "Clear", val: "$185,000", primary: true },
      { cat: "Mobile Devices", obj: "Smartphone", tc: "00:20–00:33", screen: "13s", nat: 78, safe: 95, cx: "Low", rights: "Clear", val: "$74,000" },
      { cat: "Smart Home", obj: "Smart Speaker", tc: "00:05–00:29", screen: "20s", nat: 74, safe: 93, cx: "Medium", rights: "Clear", val: "$66,000" },
      { cat: "Home / Beverage", obj: "Coffee Mug", tc: "00:28–00:41", screen: "11s", nat: 71, safe: 94, cx: "Medium", rights: "Review", val: "$38,000" },
      { cat: "Home / Lighting", obj: "Table Lamp", tc: "00:02–00:44", screen: "34s", nat: 58, safe: 97, cx: "High", rights: "Clear", val: "$22,000" }
    ];
    var opportunities = oppRaw.map(function (o) { return Object.assign({}, o, { row: rowBase(o.primary), natChip: natChip(o.nat), rightsChip: rightsChip(o.rights) }); });

    // opportunity detail metrics
    var bigVal = function (color) { return "font:600 22px var(--ui);letter-spacing:-0.4px;color:" + color + ";margin-top:8px;line-height:1"; };
    var barOf = function (pct, color) { return "width:" + pct + "%;height:100%;background:" + color; };
    var cellOf = function (i) { return "padding:18px 22px 20px;" + (i % 3 !== 0 ? "border-left:1px solid var(--line);" : "") + (i > 2 ? "border-top:1px solid var(--line);" : ""); };
    var oppMetrics = [
      { k: "Naturalness", v: "92", valStyle: bigVal("var(--green)"), hasBar: true, bar: barOf(92, "var(--green)") },
      { k: "Brand safety", v: "96", valStyle: bigVal("var(--green)"), hasBar: true, bar: barOf(96, "var(--green)") },
      { k: "Screen time", v: "26s", valStyle: bigVal("var(--ink)"), hasNote: true, note: "of 32s scene" },
      { k: "Technical complexity", v: "Low", valStyle: bigVal("var(--ink)"), hasNote: true, note: "already in frame" },
      { k: "Camera stability", v: "High", valStyle: bigVal("var(--ink)"), hasNote: true, note: "locked-off" },
      { k: "Rights status", v: "Clear", valStyle: bigVal("var(--green)"), hasNote: true, note: "configured territories" }
    ].map(function (m, i) { return Object.assign({}, m, { cell: cellOf(i), hasBar: !!m.hasBar, hasNote: !!m.hasNote }); });

    // marketplace matches
    var mCard = function (blocked) { return "display:flex;align-items:center;gap:14px;padding:15px 18px;background:var(--panel);border-radius:4px;" + (blocked ? "opacity:0.6" : ""); };
    var scoreStyle = function (s, blocked) { return "font:400 20px var(--mono);color:" + (blocked ? "var(--red)" : s >= 80 ? "var(--green)" : "var(--ink)"); };
    var statusChip = function (label, kind) {
      if (!label) return "display:none";
      var map = { block: "background:rgba(197,107,91,0.14);color:var(--red)", neutral: "background:#1E1E22;color:var(--ink2)" };
      return "padding:2px 7px;border-radius:2px;font:600 9px var(--ui);letter-spacing:0.5px;" + map[kind];
    };
    var matchRaw = [
      { brand: "Aurora Tech", line: "“Everyday Sound” · $90K–$160K · NA", score: 84, statusLabel: "", kind: "neutral" },
      { brand: "Pinnacle Performance", line: "“Move Free” · $120K–$200K · NA + EU", score: 79, statusLabel: "", kind: "neutral" },
      { brand: "NexaLife", line: "“Balance” · $60K–$120K · EU", score: 73, statusLabel: "", kind: "neutral" },
      { brand: "Vortex Energy", line: "Creative Guardian: adjacency conflicts with reflective tone", score: 41, statusLabel: "BLOCKED", kind: "block", blocked: true },
      { brand: "Stride Apparel", line: "Rights: category mismatch — apparel not in scene", score: 38, statusLabel: "BLOCKED", kind: "block", blocked: true }
    ];
    var matches = matchRaw.map(function (m) { return Object.assign({}, m, { initial: m.brand[0], card: mCard(m.blocked), scoreStyle: scoreStyle(m.score, m.blocked), statusChip: statusChip(m.statusLabel, m.kind) }); });

    var bdRaw = [
      { k: "Context fit", v: 95 }, { k: "Category fit", v: 100 }, { k: "Visibility", v: 90 },
      { k: "Brand safety", v: 96 }, { k: "Territory", v: 100 }, { k: "Budget & terms", v: 80 }
    ];
    var breakdown = bdRaw.map(function (d) { return Object.assign({}, d, { bar: "width:" + d.v + "%;height:100%;background:var(--gold)" }); });

    // deal guardrails
    var grGlyph = function (color) { return "width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;font:700 13px var(--mono);color:" + color; };
    var grTag = function (color) { return "font:600 10px var(--ui);letter-spacing:0.5px;color:" + color; };
    var guardrails = [
      { name: "Rights Agent", detail: "Pass · 3 of 4 markets cleared", mark: "✓", status: "PASS", glyph: grGlyph("var(--green)"), tag: grTag("var(--green)") },
      { name: "Creative Guardian", detail: "No plot / motivation impact", mark: "✓", status: "PASS", glyph: grGlyph("var(--green)"), tag: grTag("var(--green)") },
      { name: "Brand Accuracy", detail: "Category & product align", mark: "✓", status: "PASS", glyph: grGlyph("var(--green)"), tag: grTag("var(--green)") },
      { name: "Germany (DE)", detail: "Usage window not cleared", mark: "!", status: "REVIEW", glyph: grGlyph("var(--amber)"), tag: grTag("var(--amber)") }
    ];

    // agents
    var agCard = function (hero) { return "padding:17px;border-radius:4px;background:var(--panel);" + (hero ? "border-left:3px solid var(--green)" : "border-left:3px solid transparent"); };
    var stateChip = function (kind) {
      var map = { ok: "background:rgba(126,190,150,0.14);color:var(--green)", pass: "background:rgba(126,190,150,0.14);color:var(--green)", ready: "background:rgba(99,102,241,0.14);color:var(--gold)" };
      return "padding:2px 8px;border-radius:2px;font:600 9.5px var(--ui);letter-spacing:0.5px;" + (map[kind] || map.ok);
    };
    var agRaw = [
      { name: "Scene Agent", role: "Understand content & structure scenes", state: "Complete", kind: "ok", tool: "gemini · video.understand", lat: "1,240ms" },
      { name: "Market Agent", role: "Query commercial inventory in ClickHouse", state: "Complete", kind: "ok", tool: "mcp-clickhouse · query", lat: "45ms", hero: true },
      { name: "Brand Agent", role: "Score semantic & audience fit", state: "Complete", kind: "ok", tool: "gemini · fit.score", lat: "820ms" },
      { name: "Rights Agent", role: "Apply territory / usage / exclusivity", state: "Pass", kind: "pass", tool: "rules.evaluate (deterministic)", lat: "12ms" },
      { name: "Creative Guardian", role: "Protect story integrity · can veto", state: "Pass", kind: "pass", tool: "gemini · narrative.guard", lat: "910ms" },
      { name: "Deal Agent", role: "Assemble structured proposal", state: "Ready", kind: "ready", tool: "deal.compose", lat: "8ms" }
    ];
    var agents = agRaw.map(function (a) { return Object.assign({}, a, { card: agCard(a.hero), iconColor: a.hero ? "var(--green)" : "var(--gold)", stateChip: stateChip(a.kind) }); });

    var pipeRaw = ["Ingest", "Understand", "Discover", "Match", "Approve", "Activate"];
    var pipeStep = function (active) { return "padding:7px 13px;border-radius:2px;font:600 11.5px var(--ui);white-space:nowrap;background:" + (active ? "rgba(99,102,241,0.14)" : "var(--well)") + ";color:" + (active ? "var(--gold)" : "var(--ink2)"); };
    var pipeline = pipeRaw.map(function (label, i) { return { label: label, step: pipeStep(i === 3), arrow: i < pipeRaw.length - 1 }; });

    var traceRaw = [
      { line: "POST mcp-clickhouse/tools/call → query", dim: false },
      { line: "SELECT campaign_id, brand_name, final_score", dim: false },
      { line: "FROM brand_campaigns WHERE category='consumer_audio'", dim: false },
      { line: "AND max_budget>=100000 AND has(territories,'US')", dim: false },
      { line: "ORDER BY final_score DESC → 27 rows · 45ms", dim: true }
    ];
    var trace = traceRaw.map(function (t) { return { line: t.line, style: t.dim ? "color:#5f8a6c;margin-top:5px" : "" }; });

    // deal audit
    var dot = function (c) { return "width:8px;height:8px;border-radius:50%;background:" + c + ";flex:none;margin-top:3px"; };
    var auditBase = [
      { text: "Scene analyzed · 6 objects, 5 opportunities", who: "Scene Agent", time: "00:00", dot: dot("var(--gold)") },
      { text: "ClickHouse queried · 27 campaigns, 6 ranked", who: "Market Agent", time: "00:01", dot: dot("var(--green)") },
      { text: "Rights Pass (3/4) · Creative Guardian Pass", who: "Rights + Guardian", time: "00:02", dot: dot("var(--green)") },
      { text: "Proposal composed · $185,000 · 12mo", who: "Deal Agent", time: "00:02", dot: dot("var(--gold)") }
    ];
    var audit = state.approved
      ? auditBase.concat([{ text: "Placement APPROVED", who: "Maya Reyes (Producer)", time: "just now", dot: dot("var(--green)") }])
      : auditBase;

    // analytics
    var approvedRev = state.approved ? "$1.81M" : "$1.62M";
    var anBig = function (color) { return "font:600 25px var(--ui);letter-spacing:-0.5px;color:" + color + ";margin-top:8px;line-height:1"; };
    var anCell = function (i) { return "padding:20px 28px 20px 0;" + (i > 3 ? "border-top:1px solid var(--line);" : ""); };
    var anStatsRaw = [
      { label: "Content scanned", value: "6 titles", c: "var(--ink)" },
      { label: "Opportunities", value: "342", c: "var(--ink)" },
      { label: "Qualified matches", value: "128", c: "var(--ink)" },
      { label: "Deals closed", value: String(dealsCount), c: "var(--ink)" },
      { label: "Est. placement revenue", value: "$4.8M", c: "var(--ink)" },
      { label: "Approved revenue", value: approvedRev, c: "var(--gold)" },
      { label: "Time saved", value: "340 hrs", c: "var(--green)" },
      { label: "Approval cycle", value: "1.8 days", c: "var(--ink)" }
    ];
    var anStats = anStatsRaw.map(function (s, i) { return Object.assign({}, s, { cell: anCell(i), valStyle: anBig(s.c) }); });

    var contentRevRaw = [
      { k: "TV Series", v: "$1.9M", pct: 88 }, { k: "Feature Film", v: "$1.2M", pct: 60 },
      { k: "Microdrama", v: "$820K", pct: 42 }, { k: "YouTube / Creator", v: "$540K", pct: 28 }, { k: "Social", v: "$310K", pct: 16 }
    ];
    var contentRev = contentRevRaw.map(function (r) { return Object.assign({}, r, { bar: "width:" + r.pct + "%;height:100%;background:var(--gold)" }); });

    var topScenesRaw = [
      { name: "Rooftop Reflection", show: "HORIZONS · S2E3", val: "$185K", gold: true, thumb: "radial-gradient(circle at 40% 30%,#3a3050,#18121f)" },
      { name: "Coastal Drive", show: "Echoes of Tomorrow", val: "$142K", thumb: "radial-gradient(circle at 60% 40%,#2a3a4a,#12181f)" },
      { name: "Sci-Fi Corridor", show: "North Line · S1E4", val: "$118K", thumb: "radial-gradient(circle at 50% 50%,#453045,#191219)" },
      { name: "Night Market", show: "Second Chapter", val: "$96K", thumb: "radial-gradient(circle at 30% 60%,#4a3030,#1f1414)" }
    ];
    var topScenes = topScenesRaw.map(function (t) { return Object.assign({}, t, { valStyle: "font:700 14px var(--mono);color:" + (t.gold ? "var(--gold)" : "var(--ink)") }); });

    // analyze steps
    var p = state.progress;
    var stepDefs = [
      { label: "Uploading source", t: 8 },
      { label: "Storing to Cloud Storage", t: 24 },
      { label: "Segmenting scenes", t: 44 },
      { label: "Extracting objects (Gemini)", t: 66 },
      { label: "Writing scene intelligence (ClickHouse)", t: 86 },
      { label: "Complete", t: 100 }
    ];
    var firstActive = true;
    var steps = stepDefs.map(function (s) {
      var done = p >= s.t;
      var active = !done && firstActive;
      if (active) firstActive = false;
      var icon = done
        ? "width:18px;height:18px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;flex:none"
        : active
          ? "width:18px;height:18px;border-radius:50%;border:2px solid var(--gold);border-top-color:transparent;animation:cyspin .8s linear infinite;flex:none"
          : "width:18px;height:18px;border-radius:50%;border:2px solid #232327;flex:none";
      var text = "font-size:13px;color:" + (done ? "var(--ink)" : active ? "var(--gold)" : "var(--ink3)");
      return { label: s.label, done: done, icon: icon, text: text };
    });

    return {
      route: route, topnav: topnav,
      ctaHover: ctaHover, ghostHover: ghostHover, linkHover: linkHover, topHover: topHover,
      primaryBtnHover: primaryBtnHover, cardHover: cardHover, rowHover: rowHover,
      primaryBtn: "position:relative;display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 24px;border:1.5px solid transparent;border-radius:11px;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(90deg,#f472b6,#818cf8,#22d3ee,#4ade80,#f472b6) border-box;background-size:auto,220% auto;background-position:0 0,0 0;animation:cyshimmer 4s linear infinite;color:var(--ink);font:600 15px var(--ui);cursor:pointer;box-shadow:0 8px 30px rgba(99,102,241,0.20)",

        '<div style="background:var(--panel);padding:22px;border-radius:4px"><div style="font-family:var(--ui);font-weight:700;letter-spacing:-0.02em;font-size:19px;color:var(--ink);margin-bottom:18px">Revenue by category</div><div style="display:flex;align-items:center;gap:22px">' +
          '<svg width="120" height="120" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="#1E1E22" stroke-width="6"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="#6366F1" stroke-width="6" stroke-dasharray="34 66" stroke-dashoffset="25" transform="rotate(-90 21 21)"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="#4F46E5" stroke-width="6" stroke-dasharray="28 72" stroke-dashoffset="-9" transform="rotate(-90 21 21)"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="#4338CA" stroke-width="6" stroke-dasharray="22 78" stroke-dashoffset="-37" transform="rotate(-90 21 21)"/><circle cx="21" cy="21" r="15.9" fill="none" stroke="#312E81" stroke-width="6" stroke-dasharray="16 84" stroke-dashoffset="-59" transform="rotate(-90 21 21)"/></svg>' +
          '<div style="flex:1;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:9px;font-size:12px"><span style="width:8px;height:8px;background:#6366F1"></span><span style="color:var(--ink);flex:1">Consumer audio</span><span style="font:400 12px var(--mono);color:var(--ink2)">34%</span></div><div style="display:flex;align-items:center;gap:9px;font-size:12px"><span style="width:8px;height:8px;background:#4F46E5"></span><span style="color:var(--ink);flex:1">Mobile / devices</span><span style="font:400 12px var(--mono);color:var(--ink2)">28%</span></div><div style="display:flex;align-items:center;gap:9px;font-size:12px"><span style="width:8px;height:8px;background:#4338CA"></span><span style="color:var(--ink);flex:1">Smart home</span><span style="font:400 12px var(--mono);color:var(--ink2)">22%</span></div><div style="display:flex;align-items:center;gap:9px;font-size:12px"><span style="width:8px;height:8px;background:#312E81"></span><span style="color:var(--ink);flex:1">Beverage / other</span><span style="font:400 12px var(--mono);color:var(--ink2)">16%</span></div></div>' +
        '</div></div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">' +
        '<div style="background:var(--panel);padding:22px;border-radius:4px"><div style="font-family:var(--ui);font-weight:700;letter-spacing:-0.02em;font-size:19px;color:var(--ink);margin-bottom:18px">Revenue by content type</div><div style="display:flex;flex-direction:column;gap:15px">' +
          v.contentRev.map(function (r) { return '<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px"><span style="color:var(--ink)">' + r.k + '</span><span style="font:400 12px var(--mono);color:var(--ink2)">' + r.v + '</span></div><div style="height:4px;background:#1E1E22"><div style="' + r.bar + '"></div></div></div>'; }).join("") +
        '</div></div>' +
        '<div style="background:var(--panel);padding:22px;border-radius:4px"><div style="font-family:var(--ui);font-weight:700;letter-spacing:-0.02em;font-size:19px;color:var(--ink);margin-bottom:8px">Top performing scenes</div>' +
          v.topScenes.map(function (t) { return '<div style="display:flex;align-items:center;gap:13px;padding:11px 0;border-top:1px solid var(--line)"><div style="width:44px;height:28px;background:' + t.thumb + ';flex:none"></div><div style="flex:1"><div style="font-size:13px;color:var(--ink);font-weight:500">' + t.name + '</div><div style="font-size:11px;color:var(--ink3)">' + t.show + '</div></div><div style="' + t.valStyle + '">' + t.val + '</div></div>'; }).join("") +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function stubView(v) {
    return '<div style="animation:cyrise .3s ease;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:56vh;max-width:440px"><div style="font:400 12px var(--mono);color:var(--ink3);letter-spacing:1px">FULL BUILD SURFACE</div><h2 style="font-family:var(--ui);font-weight:700;letter-spacing:-0.02em;font-size:32px;margin:12px 0 0;color:var(--ink);line-height:1.05">' + v.stubTitle + '</h2><p style="margin:12px 0 0;color:var(--ink2);font-size:14px;line-height:1.55;text-wrap:pretty">This surface is part of the full CineYield build. For this prototype, the demo path runs through Library → Scene Intelligence → Marketplace → Deal → Analytics.</p><button' + A("go:library") + ' style="margin-top:22px;padding:11px 20px;border:1px solid var(--line2);border-radius:3px;background:transparent;color:var(--gold);font:600 13px var(--ui);cursor:pointer"' + H(v.ghostHover) + '>← Back to Studio Library</button></div>';
  }

  function overlay(v) {
    if (!v.analyzing) return "";
    return '<div style="position:fixed;inset:0;background:rgba(10,8,6,0.78);z-index:50;display:flex;align-items:center;justify-content:center">' +
      '<div style="width:452px;background:var(--panel2);padding:28px;border-radius:4px;box-shadow:0 24px 70px rgba(0,0,0,0.6)">' +
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.8" style="flex:none"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="3.5"/></svg><div><div style="font-family:var(--ui);font-weight:700;letter-spacing:-0.02em;font-size:20px;color:var(--ink);line-height:1.1">Analyzing cut</div><div style="font:400 11px var(--mono);color:var(--ink2)">HORIZONS · Rooftop Reflection.mp4</div></div></div>' +
        '<div style="height:4px;background:#1E1E22;overflow:hidden;margin:20px 0 6px"><div style="' + v.progressStyle + '"></div></div>' +
        '<div style="font:400 11px var(--mono);color:var(--ink3);text-align:right;margin-bottom:18px">' + v.progressPct + '%</div>' +
        '<div style="display:flex;flex-direction:column;gap:12px">' +
          v.steps.map(function (s) { return '<div style="display:flex;align-items:center;gap:12px"><span style="' + s.icon + '">' + (s.done ? '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4"><path d="m4 12 5 5L20 6"/></svg>' : '') + '</span><span style="' + s.text + '">' + s.label + '</span></div>'; }).join("") +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function content(v) {
    if (v.isLibrary) return libraryView(v);
    if (v.isScene) return sceneView(v);
    if (v.isOpportunity) return opportunityView(v);
    if (v.isMarketplace) return marketplaceView(v);
    if (v.isDeal) return dealView(v);
    if (v.isAgents) return agentsView(v);
    if (v.isAnalytics) return analyticsView(v);
    if (v.isStub) return stubView(v);
    return libraryView(v);
  }

  function shell(v) {
    return '<div style="display:flex;flex-direction:column;height:100vh;width:100%;background:var(--canvas);color:var(--ink);font-family:var(--ui);overflow:hidden">' +
      // announcement
      '<div style="flex:none;height:40px;display:flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(90deg,#4f46e5,#7c3aed,#4f46e5);color:#ECECFF;font:500 13px var(--ui);letter-spacing:0.01em"><span style="opacity:.85">✨</span>Introducing CineYield — turn every scene into sellable inventory<span style="opacity:.8">›</span></div>' +
      // top nav
      '<header style="flex:none;height:60px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(9,9,11,0.82);backdrop-filter:blur(10px);position:relative;z-index:20">' +
        '<div style="display:flex;align-items:center;gap:32px;min-width:0">' +
          '<div' + A("go:library") + ' style="display:flex;align-items:center;gap:9px;cursor:pointer"><svg viewBox="0 0 30 34" width="22" height="26"><path d="M15 1 L28 8.5 V25.5 L15 33 L2 25.5 V8.5 Z" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/><path d="M20 12.5 a6.5 6.5 0 1 0 0 9" fill="none" stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round"/></svg><span style="font:700 18px var(--ui);letter-spacing:-0.02em;color:var(--ink)">CineYield</span></div>' +
          '<nav style="display:flex;align-items:center;gap:22px;height:60px">' +
            v.topnav.map(function (t) { return '<button' + A("go:" + t.r) + ' style="' + t.style + '"' + H(v.topHover) + '>' + t.label + '</button>'; }).join("") +
          '</nav>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:14px;flex:none">' +
          '<div style="display:none;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--ink3);font-size:13px;width:200px" data-search><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg><span style="flex:1;white-space:nowrap;overflow:hidden">Search catalog…</span><span style="font:500 11px var(--mono);padding:1px 5px;border:1px solid var(--line2);border-radius:4px">⌘K</span></div>' +
          '<div style="display:flex;align-items:center;gap:7px"><span style="width:5px;height:5px;border-radius:50%;background:var(--green);animation:cypulse 2.4s infinite"></span><span style="font:400 11px var(--mono);color:var(--ink3)">live</span></div>' +
          '<button' + A("analyze") + ' style="display:flex;align-items:center;gap:7px;height:36px;padding:0 16px;border-radius:8px;background:var(--gold);color:#fff;font:600 13px var(--ui);cursor:pointer"' + H(v.ctaHover) + '><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Analyze a Cut</button>' +
        '</div>' +
      '</header>' +
      // content
      '<div id="cy-content" style="flex:1;overflow-y:auto"><div style="max-width:1200px;margin:0 auto;padding:28px 40px 88px;width:100%">' + content(v) + '</div></div>' +
      overlay(v) +
    '</div>';
  }

  // ------------------------------------------------------------------ render + wiring
  var appEl;
  function render() {
    var v = computeVals();
    appEl.innerHTML = shell(v);
    // wire hover states
    appEl.querySelectorAll("[data-hover]").forEach(function (el) {
      var base = el.getAttribute("style");
      var hv;
      try { hv = JSON.parse(el.getAttribute("data-hover")); } catch (e) { return; }
      el.addEventListener("mouseenter", function () { for (var k in hv) el.style[k] = hv[k]; });
      el.addEventListener("mouseleave", function () { el.setAttribute("style", base); });
    });
  }

  function onClickAction(e) {
    var el = e.target.closest("[data-action]");
    if (!el || !appEl.contains(el)) return;
    var act = el.getAttribute("data-action");
    if (act === "analyze") { analyze(); }
    else if (act === "approve") { approve(); }
    else if (act.indexOf("go:") === 0) { go(act.slice(3)); }
  }

  document.addEventListener("DOMContentLoaded", function () {
    appEl = document.getElementById("app");
    appEl.addEventListener("click", onClickAction);
    render();
  });
})();
</script>
</body>
</html>
